<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="col-md-5">
        <div class="card shadow-lg rounded-4">
            <div class="card-body p-4">
                <h3 class="text-center mb-4 text-primary fw-bold">Login</h3>

                <form>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password">
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label" for="remember">Remember me</label>
                        </div>
                        <a href="#" class="text-decoration-none">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>

                <div class="text-center my-3 text-muted">OR</div>

                <button class="btn btn-outline-dark w-100 mb-2">
                    <i class="bi bi-google me-2"></i> Login with Google
                </button>
                <button class="btn btn-outline-primary w-100">
                    <i class="bi bi-facebook me-2"></i> Login with Facebook
                </button>

                <p class="text-center mt-3 mb-0">
                    Don’t have an account? <a href="signup" class="text-decoration-none">Sign up</a>
                </p>
            </div>
        </div>
    </div>
</div>
